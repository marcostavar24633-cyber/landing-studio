name: Install Landing Studio archive

on:
  push:
    paths:
      - "landing-studio-main.zip"
      - "trigger-extract.txt"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract project files
        run: |
          test -f landing-studio-main.zip
          mkdir -p /tmp/landing-studio-archive
          unzip -q landing-studio-main.zip -d /tmp/landing-studio-archive
          test -f /tmp/landing-studio-archive/landing-studio-main/index.html
          test -f /tmp/landing-studio-archive/landing-studio-main/api/generate-landing.js
          cp -a /tmp/landing-studio-archive/landing-studio-main/. .
          rm landing-studio-main.zip
          node --check api/generate-landing.js

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Install Landing Studio AI project"
            git push
          fi
