name: Project health monitor

on:
  push:
    paths:
      - ".github/workflows/project-health-monitor.yml"
      - "scripts/project-health-monitor.mjs"
      - "lib/**"
      - "projects.json"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: project-health-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout monitor code and project registry
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Раздельно: качество (CI), публикация (CI), доступность сайта,
      # аудит SEO / адаптивности / форм / безопасности для проектов из projects.json.
      - name: Check CI status and published sites of every project
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MONITOR_REPORT: monitor-report.json
        run: node scripts/project-health-monitor.mjs

      - name: Upload machine-readable report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: monitor-report
          path: monitor-report.json
          if-no-files-found: ignore
          retention-days: 14
