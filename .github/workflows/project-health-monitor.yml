name: Project health monitor

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: project-health-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check the latest run of every workflow in each project
        uses: actions/github-script@v7
        with:
          script: |
            const repos = [
              "marcostavar24633-cyber/hair",
              "marcostavar24633-cyber/slopay-buket",
              "marcostavar24633-cyber/raki",
              "marcostavar24633-cyber/landing-studio",
              "marcostavar24633-cyber/Penka",
              "marcostavar24633-cyber/Photograf",
              "marcostavar24633-cyber/doma-tech"
            ];

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const report = [];
            const headers = {
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "Landing-Studio-Project-Monitor"
            };

            for (const fullName of repos) {
              const [projectOwner, projectRepo] = fullName.split("/");
              try {
                const response = await fetch(
                  `https://api.github.com/repos/${projectOwner}/${projectRepo}/actions/runs?branch=main&per_page=100`,
                  { headers }
                );

                if (response.status === 404) {
                  report.push(`⚪ ${fullName}: репозиторий или Actions недоступны`);
                  continue;
                }
                if (!response.ok) throw new Error(`GitHub API HTTP ${response.status}`);

                const payload = await response.json();
                const sortedRuns = (payload.workflow_runs || [])
                  .sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
                const latestByWorkflow = new Map();

                for (const run of sortedRuns) {
                  const key = String(run.workflow_id || run.name || run.id);
                  if (!latestByWorkflow.has(key)) latestByWorkflow.set(key, run);
                }

                if (latestByWorkflow.size === 0) {
                  report.push(`⚪ ${fullName}: запусков Actions в main пока нет`);
                  continue;
                }

                const openIssues = await github.paginate(github.rest.issues.listForRepo, {
                  owner, repo, state: "open", per_page: 100
                });
                const projectIssues = openIssues.filter(issue =>
                  !issue.pull_request && issue.body?.includes(`<!-- monitored-project:${fullName} -->`)
                );

                for (const latest of latestByWorkflow.values()) {
                  const workflowName = latest.name || `workflow ${latest.workflow_id || "unknown"}`;
                  const marker = `<!-- monitored-workflow:${fullName}:${latest.workflow_id || workflowName} -->`;
                  const projectMarker = `<!-- monitored-project:${fullName} -->`;
                  const existing = projectIssues.find(issue => issue.body?.includes(marker));

                  if (latest.status !== "completed") {
                    report.push(`🟡 ${fullName} / ${workflowName}: ${latest.status || "выполняется"}`);
                    continue;
                  }

                  if (latest.conclusion === "failure") {
                    const body = [
                      "Автоматический монитор обнаружил неуспешный запуск GitHub Actions.",
                      "",
                      `- Репозиторий: [${fullName}](https://github.com/${fullName})`,
                      `- Ветка: ${latest.head_branch || "main"}`,
                      `- Workflow: ${workflowName}`,
                      `- Результат: ${latest.conclusion}`,
                      `- Завершён: ${latest.updated_at}`,
                      `- Запуск: [Открыть GitHub Actions](${latest.html_url})`,
                      "",
                      "Issue обновляется при каждом новом неуспешном запуске этого workflow и закрывается после успешного запуска того же workflow.",
                      "",
                      projectMarker,
                      marker
                    ].join("\n");
                    const title = `[CI] ${fullName} — ${workflowName}`;

                    if (existing) {
                      await github.rest.issues.update({
                        owner, repo, issue_number: existing.number, title, body, state: "open"
                      });
                    } else {
                      await github.rest.issues.create({ owner, repo, title, body });
                    }
                    report.push(`🔴 ${fullName} / ${workflowName}: failure`);
                  } else if (latest.conclusion === "success") {
                    if (existing) {
                      await github.rest.issues.createComment({
                        owner, repo, issue_number: existing.number,
                        body: `Обнаружен успешный запуск [${workflowName}](${latest.html_url}). Уведомление закрыто автоматически.`
                      });
                      await github.rest.issues.update({
                        owner, repo, issue_number: existing.number, state: "closed"
                      });
                    }
                    report.push(`🟢 ${fullName} / ${workflowName}: success`);
                  } else {
                    report.push(`⚪ ${fullName} / ${workflowName}: ${latest.conclusion || "unknown"}`);
                  }
                }
              } catch (error) {
                core.warning(`${fullName}: ${error.message}`);
                report.push(`🟠 ${fullName}: ошибка проверки — ${error.message}`);
              }
            }

            await core.summary
              .addHeading("Project health monitor")
              .addTable([
                [{data:"Проект / workflow",header:true},{data:"Результат",header:true}],
                ...report.map(line => [{data:line,header:false},{data:"Проверено",header:false}])
              ])
              .addRaw("\nПроверяется последний запуск каждого workflow в main. Расписание: каждый час; также доступен ручной запуск.")
              .write();
