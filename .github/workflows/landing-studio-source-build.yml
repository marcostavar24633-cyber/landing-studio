name: Landing Studio app source and chunk build

on:
  push:
    branches:
      - feature/unique-design-architecture
    paths:
      - "scripts/extract-or-build-app.sh"
      - "scripts/build-app-chunks.cjs"
      - "src/landing-studio-app.html"
      - "src/control-center.html"
      - "api/generate-landing.js"
      - "api/generate-landing-core.js"
      - "functions/**"
      - "scripts/build-cloudflare-pages.sh"
      - "wrangler.jsonc"
      - "_routes.json"
      - ".github/workflows/landing-studio-source-build.yml"

permissions:
  contents: write

concurrency:
  group: landing-studio-source-build
  cancel-in-progress: false

jobs:
  app-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/unique-design-architecture

      - name: Extract source or rebuild browser chunks
        run: |
          bash scripts/extract-or-build-app.sh

      - name: Validate JavaScript syntax in extracted HTML scripts
        if: hashFiles('src/landing-studio-app.html') != ''
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          execFileSync(process.execPath, ['--check', 'api/generate-landing.js']);
          execFileSync(process.execPath, ['--check', 'api/generate-landing-core.js']);
          execFileSync(process.execPath, ['--input-type=module', '--check'], { input: fs.readFileSync('functions/api/generate-landing.js', 'utf8') });
          execFileSync(process.execPath, ['--input-type=module', '--check'], { input: fs.readFileSync('functions/api/site-check.js', 'utf8') });
          execFileSync(process.execPath, ['--input-type=module', '--check'], { input: fs.readFileSync('functions/api/seo-check.js', 'utf8') });
          execFileSync(process.execPath, ['--input-type=module', '--check'], { input: fs.readFileSync('functions/api/responsive-check.js', 'utf8') });
          execFileSync(process.execPath, ['--input-type=module', '--check'], { input: fs.readFileSync('functions/api/forms-check.js', 'utf8') });
          execFileSync('bash', ['scripts/build-cloudflare-pages.sh']);
          if (!fs.existsSync('dist/index.html') || !fs.existsSync('dist/_routes.json')) throw new Error('Cloudflare Pages output is incomplete.');
          const html = fs.readFileSync('src/control-center.html', 'utf8');
          const scriptStart = html.indexOf('<script>');
          const scriptEnd = html.indexOf('</script>', scriptStart);
          if (scriptStart < 0 || scriptEnd < 0) throw new Error('Control Center script was not found.');
          try { new Function(html.slice(scriptStart + 8, scriptEnd)); }
          catch (error) { console.error('Control Center JavaScript:', error.message); process.exitCode = 1; }
          console.log('Checked Control Center HTML and inline JavaScript.');
          NODE

      - name: Commit generated source or chunks
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src app-chunks index.html
          if ! git diff --cached --quiet; then
            git commit -m "Prepare editable Landing Studio app source and chunk build"
            git push origin feature/unique-design-architecture
          fi
